name: Publish SPEED.PDF Windows Installer Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión/Tag del release (ej. v0.1.25). Déjalo vacío para incrementar automáticamente el último parche.'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Título del release (opcional)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Notas del release en Markdown (opcional; vacío genera notas automáticas)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Sync release version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
              $clean = $env:INPUT_TAG.Trim().TrimStart('v')
              $tag = "v$clean"
            } else {
              $headers = @{
                Authorization = "Bearer $env:GH_TOKEN"
                "User-Agent"  = "speedpdf-release-bot"
              }
              $latestVer = [version]"0.1.0"
              try {
                try {
                  $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" -Headers $headers
                  if ($rel.tag_name -match '^v?(\d+\.\d+\.\d+)$') {
                    $rv = [version]$Matches[1]
                    if ($rv -gt $latestVer) { $latestVer = $rv }
                  }
                } catch {}
                $tags = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100" -Headers $headers
                foreach ($t in $tags) {
                  if ($t.name -match '^v?(\d+\.\d+\.\d+)$') {
                    $v = [version]$Matches[1]
                    if ($v -gt $latestVer) { $latestVer = $v }
                  }
                }
              } catch {
                Write-Warning "No se pudieron consultar tags previos; usando base 0.1.0."
              }
              $nextVer = "$($latestVer.Major).$($latestVer.Minor).$($latestVer.Build + 1)"
              $tag = "v$nextVer"
            }
          }

          if ($tag) {
            $ver = $tag.TrimStart('v')
            $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content "desktop/package.json" -Encoding UTF8
            "VITE_APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Resolved release tag: $tag (version $ver)"
          }

      - name: Build renderer bundle for Electron
        shell: pwsh
        run: |
          $env:ELECTRON_BUILD = "true"
          npm run build
          if (Test-Path "desktop/renderer") { Remove-Item -Recurse -Force "desktop/renderer" }
          New-Item -ItemType Directory -Force -Path "desktop/renderer" | Out-Null
          Copy-Item -Recurse -Force "dist\*" "desktop/renderer"

      - name: Install Electron desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows 7-11 NSIS Setup & Portable (.exe)
        working-directory: desktop
        run: npm run dist:win

      - name: Package web bundle (.zip)
        shell: pwsh
        run: |
          $ver = (Get-Content "desktop/package.json" -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "dist\*" -DestinationPath "release-assets\SPEED.PDF-v$ver-web.zip" -Force

      - name: Attach Installers to Existing Release or Tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip

      - name: Create & Publish GitHub Release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_title || format('SPEED.PDF {0}', steps.meta.outputs.tag_name) }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: |
            release-assets/*.exe
            release-assets/*.zip

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: speed-pdf-windows-installer
          path: |
            release-assets/*.exe
            release-assets/*.zip
