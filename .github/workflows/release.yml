name: Publish SPEED.PDF Windows Installer Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build renderer bundle for Electron
        shell: pwsh
        run: |
          $env:ELECTRON_BUILD = "true"
          npm run build
          if (Test-Path "desktop/renderer") { Remove-Item -Recurse -Force "desktop/renderer" }
          Copy-Item -Recurse -Force "dist" "desktop/renderer"

      - name: Sync release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
            $pkg = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content "desktop/package.json" -Encoding UTF8
          }

      - name: Install Electron desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows 7-11 NSIS Setup & Portable (.exe)
        working-directory: desktop
        run: npm run dist:win

      - name: Package web bundle (.zip)
        shell: pwsh
        run: |
          $ver = (Get-Content "desktop/package.json" -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "dist\*" -DestinationPath "release-assets\SPEED.PDF-v$ver-web.zip" -Force

      - name: Publish GitHub Release with Installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: speed-pdf-windows-installer
          path: |
            release-assets/*.exe
            release-assets/*.zip
